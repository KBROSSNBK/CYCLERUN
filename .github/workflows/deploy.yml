name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos necesarios para publicar en Pages con el despliegue oficial.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; los intermedios se descartan sin cancelar el activo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Las reglas de seguridad se prueban contra el emulador de Firestore, que
  # necesita Java: aqui esta disponible, en Windows no siempre.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Probar las reglas de Firestore
        run: |
          set +e
          npm run test:rules 2>&1 | tee rules.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # El log completo de Actions no se puede leer sin sesión, así que la
            # cola se publica como anotación del run para poder diagnosticar.
            summary=$(tail -c 2500 rules.log | python3 -c "import sys;print(sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
            echo "::error title=Fallo en las reglas de Firestore::$summary"
          fi
          exit "$code"

  build:
    needs: rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos y pruebas
        run: npm test

      - name: Construir
        env:
          # La ruta base se deduce del nombre del repositorio, de modo que
          # renombrarlo no obliga a tocar la configuracion.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
